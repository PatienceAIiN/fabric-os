[workspace]
resolver = "2"
members = [
    "libraries/libcapability",
    "libraries/libcrypto",
    "libraries/libagent",
    "libraries/libprovenance",
    "libraries/libtransaction",
    "libraries/libintent",
    "libraries/libgovernor",
    "libraries/libcredentials",
    "libraries/libprovider",
    "libraries/libipc",
    "libraries/libbroker",
    "libraries/libmemory",
    "libraries/libsandbox",
    "libraries/libsettings",
    "libraries/libmodel",
    "libraries/libresource",
    "userspace/aios",
    "userspace/aiosd",
    "userspace/aios-gui",
    "userspace/fabric-desktop",
    "tools/bench",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "ai-native-os"

# Lean profiles for a low-RAM host: keep peak build memory down.
[profile.dev]
opt-level = 0
debug = 1            # line tables only; full debuginfo balloons RAM/disk
incremental = true
codegen-units = 256

[profile.release]
opt-level = 2
lto = false          # LTO peaks RAM hard on a 7 GB machine; keep off here
codegen-units = 16
