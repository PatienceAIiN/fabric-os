[package]
name = "aiosd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local AI service daemon: provider registry, routing, system-wide AI toggle"

[[bin]]
name = "aiosd"
path = "src/main.rs"

[dependencies]
libprovider = { path = "../../libraries/libprovider" }
libcredentials = { path = "../../libraries/libcredentials" }
libipc = { path = "../../libraries/libipc" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
